<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF to data</title>
<style>
  :root { --ink:#1d2a2e; --paper:#f7f9f8; --accent:#0f6b5c; --line:#cfd9d6; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; color:var(--ink); background:var(--paper); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:#4d5f63; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:28px 16px; text-align:center; background:#fff; }
  .drop input { margin-top:8px; max-width:100%; }
  .opts { display:flex; flex-wrap:wrap; gap:16px; margin:14px 0; }
  label.opt { display:flex; gap:8px; align-items:center; }
  select, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid #7fc8b9; outline-offset:2px; }
  #status { margin:14px 0; min-height:1.5em; color:#4d5f63; }
  progress { width:100%; height:8px; }
  textarea { width:100%; height:340px; font:13px/1.4 ui-monospace, Menlo, monospace; padding:10px; border:1px solid var(--line); border-radius:8px; white-space:pre; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #preview { margin-top:14px; overflow:auto; max-height:360px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  #preview table { border-collapse:collapse; width:100%; font-size:14px; }
  #preview th, #preview td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  #preview th { background:#e8f0ee; position:sticky; top:0; }
</style>
</head>
<body>
<main>
  <h1>PDF to data</h1>
  <p class="sub">Reads the text layer first. If a page has none (a scan), it falls back to Tesseract OCR. Everything runs in your browser.</p>

  <div class="drop">
    <div>Choose a PDF</div>
    <input type="file" id="file" accept="application/pdf">
  </div>

  <div class="opts">
    <label class="opt">Mode
      <select id="mode">
        <option value="auto">Auto (text layer, OCR if empty)</option>
        <option value="ocr">Always OCR</option>
      </select>
    </label>
    <label class="opt">Output
      <select id="format">
        <option value="csv">CSV</option>
        <option value="txt">TXT</option>
        <option value="json">JSON</option>
        <option value="sqlite">SQLite database</option>
        <option value="html">HTML table</option>
      </select>
    </label>
  </div>

  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="status" role="status"></div>

  <textarea id="out" placeholder="Output appears here" readonly></textarea>
  <div id="preview" hidden></div>
  <div class="row">
    <button class="primary" id="download" disabled>Download</button>
    <button id="copy" disabled>Copy</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = id => document.getElementById(id);
let rows = [];              // every line as an array of cells
let baseName = 'output';
let tbl = null;             // detected table: { headers, names, types, data, skipped }
let sqlReady = null;

/* ---------- Reading the PDF ---------- */

// Group text items into lines by Y position, order cells by X.
function pageToRows(items) {
  const lines = [];
  for (const it of items) {
    if (!it.str.trim()) continue;
    const y = it.transform[5], x = it.transform[4];
    let line = lines.find(l => Math.abs(l.y - y) < 3);
    if (!line) { line = { y, cells: [] }; lines.push(line); }
    line.cells.push({ x, s: it.str.trim() });
  }
  lines.sort((a, b) => b.y - a.y);
  return lines.map(l => l.cells.sort((a, b) => a.x - b.x).map(c => c.s));
}

async function ocrPage(page, worker) {
  const viewport = page.getViewport({ scale: 2.5 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const { data } = await worker.recognize(canvas);
  return data.text.split('\n').filter(t => t.trim()).map(t => t.trim().split(/\s{2,}/));
}

async function run(file) {
  rows = []; $('out').value = ''; setButtons(false);
  baseName = file.name.replace(/\.pdf$/i, '');
  $('bar').hidden = false; $('bar').value = 0;
  try {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let worker = null;
    const forceOcr = $('mode').value === 'ocr';

    for (let p = 1; p <= pdf.numPages; p++) {
      $('status').textContent = `Reading page ${p} of ${pdf.numPages}…`;
      const page = await pdf.getPage(p);
      let pageRows = [];
      if (!forceOcr) pageRows = pageToRows((await page.getTextContent()).items);
      if (pageRows.length === 0) {
        $('status').textContent = `OCR on page ${p} of ${pdf.numPages}…`;
        if (!worker) worker = await Tesseract.createWorker('eng');
        pageRows = await ocrPage(page, worker);
      }
      rows.push(...pageRows);
      $('bar').value = p / pdf.numPages;
    }
    if (worker) await worker.terminate();
    render();
    $('status').textContent = `Done. ${rows.length} lines from ${pdf.numPages} page(s). ` + note();
  } catch (e) {
    console.error(e);
    $('status').textContent = 'Could not read this file: ' + e.message;
  }
  $('bar').hidden = true;
}

/* ---------- Finding the table ---------- */

function sanitizeNames(headers, W) {
  const seen = {};
  return Array.from({ length: W }, (_, j) => {
    let n = (headers ? headers[j] : '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    if (!n) n = 'col' + (j + 1);
    if (/^\d/.test(n)) n = 'c_' + n;
    if (seen[n]) { seen[n]++; n += '_' + seen[n]; } else seen[n] = 1;
    return n;
  });
}

function buildTable() {
  if (!rows.length) return null;
  // Most common cell count = the table's column count
  const counts = {};
  rows.forEach(r => counts[r.length] = (counts[r.length] || 0) + 1);
  let W = 0, best = 0;
  for (const [k, v] of Object.entries(counts)) if (v > best || (v === best && +k > W)) { W = +k; best = v; }

  let headers = null, data;
  let skipped = 0;
  if (best / rows.length >= 0.5) {
    const first = rows.findIndex(r => r.length === W);
    const isNum = s => /^-?[\d,.]+%?$/.test(s);
    if (!rows[first].some(isNum)) headers = rows[first];
    const sameAsHeader = r => headers && r.every((c, j) => c === headers[j]);
    data = rows.filter((r, i) => i >= first && r.length === W && !sameAsHeader(r));
    const headerRows = headers ? rows.filter(sameAsHeader).length : 0;
    skipped = rows.length - data.length - headerRows;
  } else {
    // Not really a table (e.g. OCR of paragraphs): keep every line, pad to the widest
    W = Math.max(...rows.map(r => r.length));
    data = rows.map(r => r.concat(Array(W - r.length).fill('')));
  }

  const intRe = /^-?(0|[1-9]\d*)$/;
  const realRe = /^-?(\d{1,3}(,\d{3})+|\d+)(\.\d+)?$/;
  const types = Array.from({ length: W }, (_, j) => {
    if (!data.length) return 'TEXT';
    if (data.every(r => intRe.test(r[j]))) return 'INTEGER';
    if (data.every(r => realRe.test(r[j]))) return 'REAL';
    return 'TEXT';
  });
  const typed = data.map(r => r.map((c, j) =>
    types[j] === 'INTEGER' ? parseInt(c, 10) :
    types[j] === 'REAL' ? parseFloat(c.replace(/,/g, '')) : c));

  return { headers, names: sanitizeNames(headers, W), types, data, typed, skipped };
}

function note() {
  const f = $('format').value;
  if (!tbl || f === 'csv' || f === 'txt' || !tbl.skipped) return '';
  return `${tbl.skipped} other line(s), such as titles, are left out of this format.`;
}

/* ---------- Formats ---------- */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const q = s => `'${String(s).replace(/'/g, "''")}'`;

function tableHtml() {
  const head = (tbl.headers || tbl.names).map(h => `<th>${esc(h)}</th>`).join('');
  const body = tbl.data.map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('\n');
  return `<table>\n<thead><tr>${head}</tr></thead>\n<tbody>\n${body}\n</tbody>\n</table>`;
}

function sqlDump() {
  const t = sanitizeNames([baseName], 1)[0];
  const colsDef = tbl.names.map((n, j) => `"${n}" ${tbl.types[j]}`).join(', ');
  const lines = [`CREATE TABLE "${t}" (${colsDef});`];
  tbl.typed.forEach(r => {
    lines.push(`INSERT INTO "${t}" VALUES (${r.map(v => typeof v === 'number' ? v : q(v)).join(', ')});`);
  });
  return lines.join('\n');
}

function currentOutput() {
  switch ($('format').value) {
    case 'csv': return rows.map(r => r.map(c => '"' + c.replace(/"/g, '""') + '"').join(',')).join('\n');
    case 'txt': return rows.map(r => r.join('\t')).join('\n');
    case 'json': return JSON.stringify(tbl.typed.map(r => Object.fromEntries(tbl.names.map((n, j) => [n, r[j]]))), null, 2);
    case 'html': return `<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>${esc(baseName)}</title>\n<style>table{border-collapse:collapse;font:14px system-ui}th,td{border:1px solid #ccc;padding:4px 8px;text-align:left}th{background:#eee}</style></head>\n<body>\n${tableHtml()}\n</body></html>`;
    case 'sqlite': return sqlDump();
  }
}

function render() {
  if (!rows.length) return;
  tbl = buildTable();
  $('out').value = currentOutput();
  const isHtml = $('format').value === 'html';
  $('preview').hidden = !isHtml;
  if (isHtml) $('preview').innerHTML = tableHtml();
  setButtons(true);
}

function setButtons(on) { $('download').disabled = !on; $('copy').disabled = !on; }

/* ---------- Download / copy ---------- */

function save(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

async function getSql() {
  if (!sqlReady) sqlReady = initSqlJs({ locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + f });
  return sqlReady;
}

$('download').onclick = async () => {
  const f = $('format').value;
  if (f === 'sqlite') {
    try {
      const SQL = await getSql();
      const db = new SQL.Database();
      db.exec(sqlDump());
      const bytes = db.export();
      db.close();
      save(baseName + '.sqlite', bytes, 'application/vnd.sqlite3');
    } catch (e) {
      $('status').textContent = 'Could not build the SQLite file: ' + e.message;
    }
    return;
  }
  const types = { csv:'text/csv', txt:'text/plain', json:'application/json', html:'text/html' };
  save(`${baseName}.${f}`, $('out').value, types[f]);
};

$('copy').onclick = async () => {
  await navigator.clipboard.writeText($('out').value);
  $('status').textContent = 'Copied to clipboard.';
};

$('file').addEventListener('change', e => { if (e.target.files[0]) run(e.target.files[0]); });
$('format').addEventListener('change', () => { render(); $('status').textContent = note(); });
</script>
</body>
</html>
